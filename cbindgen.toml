language = "C"
include_guard = "MUU_FFI_H"
pragma_once = true
usize_is_size_t = true
documentation = true
style = "both"

[parse]
parse_deps = false

[export]
include = [
    "MuuBuffer",
    "MuuEngine",
    "muu_abi_version",
    "muu_core_version",
    "muu_engine_create",
    "muu_engine_destroy",
    "muu_engine_handle_event",
    "muu_buffer_free",
]

[export.rename]
"MuuEngine" = "MuuEngine"
