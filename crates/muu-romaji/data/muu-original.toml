# Muu original romaji table, derived independently from standard Japanese
# romanization conventions. This data was not copied from any existing IME.
# SPDX-License-Identifier: MIT

schema_version = 1
name = "muu-original"
boundary_inputs = [
  "!", "\"", "#", "$", "%", "&", "'", "(", ")", "*", "+", ",", "-",
  ".", "/", ":", ";", "<", "=", ">", "?", "@", "[", "\\", "]", "^",
  "_", "`", "{", "|", "}", "~",
]

[nasal]
continue_with = ["a", "i", "u", "e", "o", "y"]
explicit_with = ["n", "'"]
commit_before = [
  "b", "c", "d", "f", "g", "h", "j", "k", "l", "m", "p", "q", "r", "s",
  "t", "v", "w", "x", "z", "!", "\"", "#", "$", "%", "&", "'", "(",
  ")", "*", "+", ",", "-", ".", "/", ":", ";", "<", "=", ">", "?", "@",
  "[", "\\", "]", "^", "_", "`", "{", "|", "}", "~",
]

