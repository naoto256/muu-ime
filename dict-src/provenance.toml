transformation = "vendors upstream data verbatim. maps dictionary00..09, id.def, connection_single_column.txt, symbol.tsv, and symbol ordering_rule.txt into the deterministic Muu binary dictionary. Symbol rows expand their space-separated readings, preserve Mozc relative ordering in ten-point cost steps, and use a lexical-safe base cost."
notes = "The vendored upstream set is 24 data and README files plus LICENSE; BUILD.bazel is intentionally excluded. Mozc does not distribute char.def or unk.def. Muu's character-class unknown-word model is original Muu code."

