spdx_license = "Apache-2.0 AND BSD-3-Clause"
copyright_holders = [
  "Works Applications Co., Ltd.",
  "The UniDic Consortium",
  "Toshinori Sato and mecab-unidic-NEologd contributors",
]
attribution_text = [
  "THIRD_PARTY_LICENSES/dictionaries/sudachidict/LICENSE-2.0.txt",
  "THIRD_PARTY_LICENSES/dictionaries/sudachidict/LEGAL.txt",
]
source_root = "dict-src/sudachidict-core-supplement.tsv"
used_fields = [
  "reading",
  "surface",
  "word_cost",
  "pos",
]
transformation = "The manual re-import script verifies the official small_lex.zip and core_lex.zip SHA-256 pins, converts Katakana readings to NFC Hiragana, selects ordinary nouns and declared proper-noun classes, maps them to pinned Mozc context IDs, removes exact reading/surface pairs already present in Mozc, retains the lowest cost for exact duplicate records, applies deterministic bounds, and atomically emits the committed TSV. Product builds consume only that generated TSV."
notes = "Official archive SHA-256: small_lex.zip b578ac9545899783d5d7e30d5d78d5d9dcf40b36965d4af0663ec2eb041c1093; core_lex.zip a2b39e1572adab08a649b1390b134517adc55f1d733c59358b113298788bf31c. The archives remain outside the product repository; this manifest, generator, generated TSV, and full license notices provide the reproducible audit trail."

