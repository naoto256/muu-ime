# Stable, deliberately coarse POS classes for the kana-kanji segmenter.
#
# Mozc id.def has 2,672 context IDs, including inflection-specific variants.
# Each context ID is mapped by its first POS field. Tokens retain separate
# left and right classes so compound tokens with lid != rid keep both endpoint
# categories. IDs are frozen with the Muu dictionary format.

schema_version = 1

[[classes]]
mozc_major = "BOS/EOS"
muu = "bos_eos"
id = 0

[[classes]]
mozc_major = "その他"
muu = "other"
id = 1

[[classes]]
mozc_major = "フィラー"
muu = "filler"
id = 2

[[classes]]
mozc_major = "副詞"
muu = "adverb"
id = 3

[[classes]]
